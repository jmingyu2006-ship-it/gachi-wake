<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1322">
<meta name="description" content="하루를 시작하고 싶은 시각을 정하고, 같이 지켜요.">
<title>같이 일어나요</title>
<!--__WEB_HEAD__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0E1322; --surface: #171D30; --surface2: #20283F; --line: #2B3450;
    --ink: #F4F1EA; --muted: #A6ADBF; --dim: #7E869B;
    --win: #283049; --lit: #FFC75A; --lit-hi: #FFE7A8; --sun: #FF8A4C; --sun-ink: #1E1206;
    --good: #5BD6A0; --close: #FFC75A; --late: #FF9B8A;
    --num: 'Space Grotesk', 'Noto Sans KR', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ink); }
  [hidden] { display: none !important; }
  body { font-family: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 440px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; padding: 16px 20px 0; }
  header { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
  .brand { font-weight: 900; font-size: 18px; letter-spacing: -0.4px; }
  .brand small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 1px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
  .trial { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 6px 6px 6px 14px; border-radius: 14px; background: #2A2240; color: var(--ink); font-size: 13px; border: 1px solid #4A3D6B; }
  .trial[hidden] { display: none; }
  .trial button { background: transparent; border: 1px solid #6B5C92; border-radius: 10px; min-height: 36px; padding: 0 12px; font-size: 13px; }
  main { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 10px 0 16px; }
  .fade { animation: fade .35s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
  .label { font-size: 13px; color: var(--muted); }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }

  /* 장면: 밤하늘 + 건물 + 창문 */
  .scene { position: relative; border-radius: 22px; background: #121A2E; border: 1px solid var(--line); padding: 18px 16px 0; overflow: hidden; transition: background 1.2s ease; }
  .scene.dawn { background: #22243F; }
  .sky { position: relative; height: 54px; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #C9CFE0; opacity: .55; }
  .orb { position: absolute; right: 18px; top: 6px; width: 30px; height: 30px; border-radius: 50%; background: #E9E4D2; box-shadow: inset -8px -3px 0 0 #121A2E; transition: all 1.2s ease; }
  .scene.dawn .orb { background: var(--sun); box-shadow: 0 0 26px rgba(255,138,76,.7); top: 14px; }
  .scene.dawn .star { opacity: .15; transition: opacity 1.2s; }
  .building { position: relative; margin: 0 auto; width: max-content; background: #1A2238; border: 1px solid #2D3756; border-bottom: none; border-radius: 10px 10px 0 0; padding: 14px 12px 12px; }
  .building::before { content: ''; position: absolute; left: 50%; top: -14px; width: 2px; height: 14px; background: #2D3756; }
  .grid { display: grid; grid-template-columns: repeat(12, 17px); grid-auto-rows: 14px; gap: 6px; }
  .win { position: relative; border-radius: 3px; background: var(--win); transition: background .4s, box-shadow .4s; }
  .win.on { background: var(--lit); box-shadow: 0 0 10px rgba(255,199,90,.45); }
  .win.pop { animation: flick .9s ease-out both; }
  @keyframes flick { 0% { background: var(--win); box-shadow: none; } 25% { background: var(--lit-hi); box-shadow: 0 0 18px rgba(255,225,150,.9); } 40% { background: #3B4260; box-shadow: none; } 60% { background: var(--lit-hi); } 100% { background: var(--lit); box-shadow: 0 0 10px rgba(255,199,90,.45); } }
  .win.blink { animation: blink 1.4s ease-in-out; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .win.me.on { background: var(--sun); box-shadow: 0 0 18px rgba(255,138,76,.85); animation: meon 1.4s ease-out both; z-index: 1; }
  @keyframes meon { 0% { transform: scale(1); background: var(--win); } 30% { transform: scale(1.7); background: #FFD2B5; } 100% { transform: scale(1); background: var(--sun); } }
  .win.me.on::after { content: '나'; position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); font-size: 10.5px; font-weight: 900; color: var(--sun-ink); background: var(--sun); padding: 1px 5px; border-radius: 6px; white-space: nowrap; }
  /* 오늘의 하늘 (기록한 날 장면 위쪽) */
  .sky .fx { position: absolute; inset: -18px -16px 0; pointer-events: none; opacity: .9; }
  .fx-rainbow { background: radial-gradient(circle at 50% 120%, transparent 52%, rgba(255,90,90,.35) 53%, rgba(255,190,80,.35) 56%, rgba(255,240,120,.32) 59%, rgba(120,220,140,.3) 62%, rgba(110,170,255,.3) 65%, rgba(160,120,255,.28) 68%, transparent 70%); }
  .fx-aurora { background: linear-gradient(100deg, transparent 10%, rgba(80,255,190,.28) 30%, rgba(90,200,255,.22) 50%, rgba(170,120,255,.2) 65%, transparent 85%); filter: blur(6px); animation: aur 9s ease-in-out infinite alternate; }
  @keyframes aur { from { transform: translateX(-6%) skewY(-3deg); } to { transform: translateX(6%) skewY(3deg); } }
  .fx-clouds { background: radial-gradient(ellipse 60px 14px at 25% 40%, rgba(255,255,255,.28), transparent 70%), radial-gradient(ellipse 80px 16px at 70% 60%, rgba(255,255,255,.22), transparent 70%); animation: drift 30s linear infinite alternate; }
  @keyframes drift { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
  .fx-mist { background: linear-gradient(180deg, transparent 30%, rgba(240,236,228,.28) 100%); }
  .fx-halo { background: radial-gradient(circle at calc(100% - 49px) 47px, transparent 22px, rgba(255,255,240,.45) 24px, transparent 28px); }
  .fx-meteor::before, .fx-meteor::after { content: ''; position: absolute; width: 60px; height: 1.5px; background: linear-gradient(90deg, rgba(255,255,255,0), #fff); transform: rotate(-25deg); animation: met 4s ease-in infinite; top: 10px; left: 10%; opacity: 0; }
  .fx-meteor::after { animation-delay: 2.1s; top: 22px; left: 45%; }
  @keyframes met { 0% { opacity: 0; transform: translate(0, 0) rotate(-25deg); } 8% { opacity: 1; } 22% { opacity: 0; transform: translate(70px, 32px) rotate(-25deg); } 100% { opacity: 0; } }
  .fx-drops { background-image: radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1.5px); background-size: 23px 19px; opacity: .35; }
  .scene.dawn.sky-stars .star, .scene.dawn.sky-meteor .star, .scene.dawn.sky-aurora .star { opacity: .7; }
  .sky-swatch { display: inline-block; width: 22px; height: 22px; border-radius: 7px; vertical-align: middle; border: 1px solid rgba(255,255,255,.18); flex: none; }
  .tier { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .tier.t0 { background: #2B3450; color: var(--muted); } .tier.t1 { background: #2E3B5E; color: #A9C8FF; }
  .tier.t2 { background: #3A2E5E; color: #D3B5FF; } .tier.t3 { background: linear-gradient(90deg, #5B3A12, #6B2E5E); color: #FFE3A3; }
  .sky-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .sky-row .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .shield { display: inline-flex; gap: 3px; vertical-align: middle; }
  .shield i { width: 12px; height: 14px; display: inline-block; background: #3A4466; clip-path: polygon(50% 0, 100% 18%, 100% 55%, 50% 100%, 0 55%, 0 18%); }
  .shield i.on { background: #7FD3FF; }
  .cell.rest { background: #1E3346; color: #7FD3FF; border: 1px dashed #3C6A8C; }
  /* 습관 탭: 내 건물(66칸), 하늘 도감, 칭호 */
  .my-bld { margin: 12px auto 0; width: max-content; background: #1A2238; border: 1px solid #2D3756; border-bottom: none; border-radius: 12px 12px 0 0; padding: 12px; }
  .my-bld .g { display: grid; grid-template-columns: repeat(6, 26px); grid-auto-rows: 18px; gap: 6px; }
  .my-bld .w { border-radius: 4px; background: var(--win); }
  .my-bld .w.on { box-shadow: 0 0 8px rgba(255,199,90,.35); }
  .my-bld .w.next { outline: 1.5px dashed #6B7699; outline-offset: -1.5px; background: transparent; }
  .bld-ground { height: 8px; background: #1A2238; border-top: 1px solid #2D3756; margin: 0 -18px; }
  .skyline { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
  .skyline i { width: 14px; height: 22px; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--lit), #C8902E); }
  .dex { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .dex .it { border-radius: 14px; padding: 8px 6px; text-align: center; background: var(--surface2); border: 1px solid var(--line); min-height: 86px; }
  .dex .sw { height: 38px; border-radius: 9px; margin-bottom: 6px; }
  .dex .it.no .sw { background: repeating-linear-gradient(45deg, #222A42 0 6px, #1C2338 6px 12px); display: grid; place-items: center; color: #4D577A; font-weight: 900; }
  .dex .nm { font-size: 11.5px; font-weight: 700; line-height: 1.3; }
  .dex .ct { font-size: 11px; color: var(--muted); }
  .titles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .titles span { font-size: 12.5px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .titles span.got { border-color: #6B5A2E; color: var(--lit); background: rgba(255,199,90,.08); }
  .recap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  /* 방: 모두 켜진 날 */
  .scene.all-lit .building { box-shadow: 0 0 0 1px rgba(255,199,90,.5), 0 0 40px rgba(255,199,90,.35); animation: alllit 2.4s ease-in-out 2; }
  @keyframes alllit { 50% { box-shadow: 0 0 0 2px rgba(255,220,140,.9), 0 0 70px rgba(255,199,90,.6); } }
  .scene.all-lit #roomLine b { color: var(--lit); }

  /* 불 켜기 연출 */
  .cer { position: fixed; inset: 0; z-index: 60; overflow: hidden; background: #060A15; color: var(--ink); -webkit-user-select: none; user-select: none; }
  .cer-sky { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s ease .55s; }
  .cer canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cer-sun { position: absolute; left: 50%; top: 40%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; opacity: 0; transform: translateY(170px) scale(.55); transition: transform 2.2s cubic-bezier(.2,.8,.2,1) .7s, opacity 1.2s ease .7s; }
  .cer-rays { position: absolute; left: 50%; top: 40%; width: 760px; height: 760px; margin: -380px 0 0 -380px; opacity: 0; transition: opacity 1.6s ease 1.4s;
    background: repeating-conic-gradient(from 0deg, rgba(255,244,214,.17) 0 5deg, transparent 5deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 62%); mask-image: radial-gradient(circle, #000 12%, transparent 62%); animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cer-win { position: absolute; left: 50%; top: 17%; width: 96px; height: 80px; margin-left: -48px; border-radius: 16px; background: #283049; box-shadow: 0 0 0 7px #1A2238, 0 0 0 8px #2D3756; }
  .cer-win::before, .cer-win::after { content: ''; position: absolute; background: rgba(26,34,56,.9); }
  .cer-win::before { left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; } .cer-win::after { top: 50%; left: 0; right: 0; height: 4px; margin-top: -2px; }
  @keyframes cwin { 0% { background: #283049; } 18% { background: #FFF1C9; box-shadow: 0 0 0 7px #1A2238, 0 0 0 8px #2D3756, 0 0 80px 30px rgba(255,225,150,.9); } 30% { background: #3B4260; box-shadow: 0 0 0 7px #1A2238, 0 0 0 8px #2D3756; } 46% { background: #FFE7A8; } 100% { background: var(--lit); box-shadow: 0 0 0 7px #1A2238, 0 0 0 8px #2D3756, 0 0 70px 24px rgba(255,199,90,.55); } }
  .cer-ring { position: absolute; left: 50%; top: 17%; width: 96px; height: 80px; margin-left: -48px; border-radius: 22px; border: 3px solid rgba(255,215,120,.0); }
  @keyframes ring { 0% { transform: scale(.8); border-color: rgba(255,215,120,.9); opacity: 1; } 100% { transform: scale(2.6); border-color: rgba(255,215,120,0); opacity: 0; } }
  .cer-panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 22px calc(20px + env(safe-area-inset-bottom)); text-align: center;
    background: linear-gradient(180deg, rgba(10,14,26,0), rgba(10,14,26,.82) 22%, rgba(10,14,26,.95)); }
  .cer .rv { opacity: 0; transform: translateY(12px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  .cer-time { font-family: var(--num); font-size: 68px; font-weight: 700; color: var(--lit); line-height: 1; letter-spacing: -2px; text-shadow: 0 0 30px rgba(255,199,90,.35); }
  .cer-title { font-size: 20px; font-weight: 900; margin-top: 8px; }
  .cer-badge { margin-top: 10px; }
  .cer-card { display: flex; align-items: center; gap: 12px; text-align: left; margin: 16px auto 0; max-width: 360px; padding: 12px 14px; border-radius: 18px; background: rgba(23,29,48,.9); border: 1px solid var(--line); }
  .cer .rv.cer-card { transform: perspective(600px) rotateX(70deg); transform-origin: 50% 0; }
  .cer-card .sky-swatch { width: 46px; height: 46px; border-radius: 12px; }
  .cer-card .nm { font-size: 16px; font-weight: 900; }
  .cer-card .sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .cer-card.t2, .cer-card.t3 { border-color: #6B5A9E; box-shadow: 0 0 24px rgba(170,130,255,.25); }
  .cer-card.t3 { border-color: #9E7A3A; box-shadow: 0 0 30px rgba(255,200,110,.35); }
  .new-tag { display: inline-block; font-size: 10.5px; font-weight: 900; color: #0E1322; background: var(--lit); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .cer-stats { display: flex; justify-content: center; gap: 22px; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .cer-stats b { display: block; font-family: var(--num); font-size: 26px; color: var(--ink); margin-top: 2px; }
  .cer-stats b.bump { animation: bump .6s cubic-bezier(.2,1.6,.4,1); color: var(--lit); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
  .cer-extra { margin-top: 12px; font-size: 13.5px; color: #D8D3C8; line-height: 1.7; }
  .cer-extra .ms { display: inline-block; margin-bottom: 4px; padding: 6px 12px; border-radius: 999px; background: rgba(255,199,90,.14); border: 1px solid rgba(255,199,90,.5); color: var(--lit); font-weight: 900; }
  .cer-actions { display: flex; gap: 10px; margin-top: 16px; }
  .cer-actions > * { flex: 1; min-height: 52px; }
  .cer-snd { position: absolute; right: 14px; top: calc(14px + env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18); background: rgba(10,14,26,.4); color: var(--ink); font-size: 18px; z-index: 2; }
  .cer-skip { position: absolute; left: 10px; top: calc(14px + env(safe-area-inset-top)); font-size: 12px; color: rgba(244,241,234,.55); z-index: 2; padding: 12px 8px; min-height: 44px; background: none; border: none; }
  .cer.go .cer-sky { opacity: 1; }
  .cer.go .cer-sun { opacity: 1; transform: none; }
  .cer.go.e2 .cer-rays { opacity: 1; }
  .cer.go .cer-win { animation: cwin 1.25s ease-out .15s both; }
  .cer.go.e4 .cer-ring { animation: ring 1.6s ease-out 1.1s 2; }
  .cer.go .rv { opacity: 1; transform: none; }
  .cer.go .d1 { transition-delay: 1.15s; } .cer.go .d2 { transition-delay: 1.35s; } .cer.go .d3 { transition-delay: 1.55s; }
  .cer.go .d4 { transition-delay: 2.1s; transition-duration: .8s; } .cer.go .d5 { transition-delay: 2.7s; } .cer.go .d6 { transition-delay: 3.1s; } .cer.go .d7 { transition-delay: 3.4s; }
  .cer.done .rv, .cer.done .cer-sky, .cer.done .cer-sun, .cer.done .cer-rays { transition-delay: 0s !important; transition-duration: .25s !important; }
  .cer.done .cer-win { animation-duration: .01s; animation-delay: 0s; }
  @media (prefers-reduced-motion: reduce) { .cer *, .cer { transition: none !important; animation: none !important; } .cer .cer-win { background: var(--lit); } }
  .ground { height: 10px; background: #1A2238; border-top: 1px solid #2D3756; margin: 0 -16px; }
  .scene-meta { display: flex; align-items: center; gap: 8px; padding: 12px 2px 14px; font-size: 14px; }
  .scene-meta b { font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(91,214,160,.6); animation: pulse 2s infinite; flex: none; }
  .dot.demo { background: var(--muted); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(91,214,160,.6); } 70% { box-shadow: 0 0 0 8px rgba(91,214,160,0); } 100% { box-shadow: 0 0 0 0 rgba(91,214,160,0); } }
  .scene-sub { margin: -8px 2px 14px 18px; font-size: 12.5px; color: var(--muted); min-height: 0; }
  /* 전체 / 우리 방 전환 */
  .switch { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 2px; scrollbar-width: none; }
  .switch::-webkit-scrollbar { display: none; }
  .switch button { flex: none; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 700; padding: 0 14px; color: var(--muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--night); border-color: var(--ink); }
  .switch button.add { color: var(--lit); border-style: dashed; }
  /* 방 건물: 창문마다 이름과 시각 */
  .building.room { width: auto; padding: 16px 14px 14px; }
  .room-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 10px; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; background: none; border: none; padding: 4px 0; margin: 0; color: inherit; font: inherit; border-radius: 10px; cursor: pointer; }
  .unit:focus-visible { outline: 3px solid var(--lit); outline-offset: 2px; }
  .unit:active .w { transform: scale(0.96); }
  .pstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pstats .card { padding: 12px 10px; border-radius: 16px; background: var(--surface2); }
  .pstats .stat-num { font-size: 22px; }
  .unit .w { width: 100%; height: 42px; border-radius: 6px; background: var(--win); transition: background .4s, box-shadow .4s; }
  .unit.on .w { background: var(--lit); box-shadow: 0 0 12px rgba(255,199,90,.5); }
  .unit.pop .w { animation: flick .9s ease-out both; }
  .unit.me.on .w { background: var(--sun); box-shadow: 0 0 16px rgba(255,138,76,.8); }
  .unit .nm { font-size: 12.5px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .unit.on .nm { color: var(--ink); }
  .unit .tm { font-size: 11.5px; color: var(--dim); font-family: var(--num); }
  .unit.on .tm { color: var(--lit); }
  .unit.me.on .tm { color: var(--sun); }
  .code { font-family: var(--num); letter-spacing: 1px; color: var(--ink); }
  .crown { display: inline-block; vertical-align: -1px; margin-right: 2px; color: var(--lit); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--lit); background: rgba(255,199,90,.12); border-radius: 999px; padding: 3px 9px; vertical-align: 3px; margin-left: 6px; }
  .account { margin-top: 6px; }
  .account .row { display: flex; gap: 8px; margin-top: 10px; }
  .account .row button { flex: 1; }
  .field input[type=password] { letter-spacing: 1px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); margin: 2px 0 8px; min-height: 40px; }
  .check input { width: 20px; height: 20px; accent-color: var(--lit); flex: none; }
  .check a, .legal-line a { color: var(--lit); }
  .cheers { display: flex; gap: 8px; flex-wrap: wrap; }

  // ---------- claude.ai 안에서 열었을 때: 본인 전용 저장소 (선택) ----------
  var Cloud = {
    db: null, uid: null,
    connect: function () {
      var self = this;
      if (!(window.claude && typeof window.claude.use === 'function')) return Promise.resolve(false);
      return Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
        if (!r[0] || !r[1] || typeof r[1].id !== 'function') return false;
        return r[1].id().then(function (uid) { if (!uid) return false; self.db = r[0]; self.uid = uid; return true; });
      }).catch(function () { return false; });
    },
    col: function () { return this.db.collection('data/users/' + this.uid); },
    load: function () {
      return Promise.race([this.col().get(), delay(10000).then(function () { throw { code: 'timeout' }; })]).then(function (snap) {
        var out = { records: [], settings: null };
        snap.docs.forEach(function (d) {
          if (!d.exists) return;
          if (d.id === 'settings') out.settings = d.data(); else out.records.push(d.data());
        });
        return out;
      });
    },
    save: function (id, data) {
      var self = this;
      if (!self.db) return Promise.resolve();
      return self.col().doc(id).set(data).catch(function () { self.db = null; });
    }
  };

  // ---------- 공유 서버 (설정했을 때만) ----------
  var Server = {
    on: !!(CFG.supabaseUrl && CFG.supabaseAnonKey),
    base: String(CFG.supabaseUrl || '').replace(/\/+$/, ''),
    headers: function () {
      return { 'apikey': CFG.supabaseAnonKey, 'Authorization': 'Bearer ' + CFG.supabaseAnonKey, 'Content-Type': 'application/json' };
    },
    push: function (rec) {
      var h = this.headers(); h['Prefer'] = 'return=minimal';
      return fetch(this.base + '/rest/v1/wake_events', { method: 'POST', headers: h, body: JSON.stringify(L.serverPayload(rec, anonId)) })
        .then(function (r) {
          if (r.ok || r.status === 409) return 'sent';
          // 서버가 규칙상 거절(날짜 범위·요청 제한 등): 다시 보내도 같으니 대기열에서 뺀다
          if (r.status >= 400 && r.status < 500 && r.status !== 408 && r.status !== 429) return 'rejected';
          throw new Error('push ' + r.status);
        });
    },
    rpc: function (name, args) {
      return fetch(this.base + '/rest/v1/rpc/' + name, { method: 'POST', headers: this.headers(), body: JSON.stringify(args) })
        .then(function (r) {
          return r.text().then(function (t) {
            var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = null; }
            if (!r.ok) { var err = new Error((j && j.message) || ('http_' + r.status)); err.status = r.status; throw err; }
            return j;
          });
        });
    },
    counts: function (day) {
      return fetch(this.base + '/rest/v1/rpc/day_counts', { method: 'POST', headers: this.headers(), body: JSON.stringify({ p_day: day }) })
        .then(function (r) { if (!r.ok) throw new Error('counts ' + r.status); return r.json(); })
        .then(L.parseServerCounts);
    }
  };

  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function persist(rec) {
    state.saving = state.saving.then(function () {
      var ok = Local.set(K.records, state.records);
      if (!ok) toast('저장하지 못했어요. 이 창을 닫으면 기록이 사라질 수 있어요.');
      var jobs = [Cloud.save(rec.id, rec)];
      if (Server.on && !state.trial) {
        var pend = Local.get(K.pending) || [];
        if (pend.indexOf(rec.date) < 0) pend.push(rec.date);
        Local.set(K.pending, pend);
        jobs.push(syncPending());
      }
      if (Server.on && !state.trial && state.rooms.length) { queueRoomStart(rec.date); jobs.push(syncRoomStarts()); }
      saveAccountSoon();
      return Promise.all(jobs);
    });
  }
  function queueRoomStart(day) {
    var pend = Local.get(K.pendingRoom) || [];
    if (pend.indexOf(day) < 0) { pend.push(day); Local.set(K.pendingRoom, pend); }
  }
  function syncRoomStarts() {
    if (!Server.on || !state.rooms.length) return Promise.resolve();
    var drop = function (day) { Local.set(K.pendingRoom, (Local.get(K.pendingRoom) || []).filter(function (d) { return d !== day; })); };
    var pend = (Local.get(K.pendingRoom) || []).filter(function (d) { return typeof d === 'string'; });
    return pend.reduce(function (p, day) {
      return p.then(function () {
        var rec = L.findDay(state.records, day);
        if (!rec) return drop(day);
        return Server.rpc('room_start', { p_anon: anonId, p_day: day, p_min: rec.minuteOfDay }).then(function () { drop(day); }, function (e) {
          if (e.status >= 400 && e.status < 500 && e.status !== 408 && e.status !== 429) drop(day); else throw e;
        });
      });
    }, Promise.resolve()).then(refreshRoom).catch(function () {});
  }
  function syncPending() {
    if (!Server.on) return Promise.resolve();
    var pend = (Local.get(K.pending) || []).filter(function (d) { return typeof d === 'string'; });
    return pend.reduce(function (p, day) {
      return p.then(function () {
        var rec = L.findDay(state.records, day);
        if (!rec) return;
        return Server.push(rec).then(function (res) {
          if (res === 'rejected') state.rejected = (state.rejected || []).concat([day]);
          Local.set(K.pending, (Local.get(K.pending) || []).filter(function (d) { return d !== day; }));
          state.serverOk = true; refreshCrowd();
        });
      });
    }, Promise.resolve()).catch(function () { state.serverOk = false; });
  }
  function saveSettings(s) {
    state.settings = s;
    if (!Local.set(K.settings, s)) toast('설정을 저장하지 못했어요.');
    Cloud.save('settings', s);
    syncProfile();
    saveAccountSoon();
    if (Local.get(K.push)) updatePushPrefs();
  }

  // ---------- 시간 ----------
  function realNow() { return new Date(); }
  function effectiveNow() {
    var d = realNow();
    if (state.trial) {
      var sec = Math.floor((Date.now() - state.trial.startedAt) / 1000);
      var total = state.trial.minute * 60 + sec;
      d.setHours(Math.floor(total / 3600), Math.floor(total / 60) % 60, total % 60, 0);
    }
    return d;
  }
  function currentRecords() {
    if (!state.trial) return state.records;
    var key = L.toDateKey(realNow());
    var others = state.records.filter(function (r) { return r.date !== key; });
    return state.trial.record ? others.concat([state.trial.record]) : others;
  }
  function nowMinuteFrac(d) { return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }

  // ---------- 장면 (한 번 만들고 계속 재사용) ----------
  var scene = document.createElement('div');
  scene.className = 'scene';
  (function buildScene() {
    var sky = '<div class="sky" aria-hidden="true">';
    var rand = (function (s) { return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; })(7);
    for (var i = 0; i < 18; i++) sky += '<span class="star" style="left:' + Math.round(rand() * 92) + '%;top:' + Math.round(rand() * 80) + '%"></span>';
    sky += '<span class="orb"></span></div>';
    scene.innerHTML = sky + '<div class="building" role="img" id="buildingImg" aria-label="불 켜진 창문"><div class="grid" id="winGrid"></div></div><div class="ground"></div>' +
      '<div class="scene-meta"><span class="dot" id="liveDot"></span><span id="crowdLine">불러오는 중</span><span class="per" id="perLine"></span></div>' +
      '<div class="scene-sub" id="recentLine"></div>';
  })();
  // 창문: 1칸 = 1명. 0번이 맨 아래층 왼쪽이고, 사람이 늘면 위로 층이 올라간다.
  var gridEl = scene.querySelector('#winGrid'), winEls = [], gridTotal = 0;
  function buildGrid(total) {
    var rows = total / L.COLS, html = '';
    for (var r = 0; r < rows; r++) for (var c = 0; c < L.COLS; c++) html += '<span class="win" data-i="' + ((rows - 1 - r) * L.COLS + c) + '"></span>';
    gridEl.innerHTML = html;
    winEls = [];
    gridEl.querySelectorAll('.win').forEach(function (el) { winEls[+el.dataset.i] = el; });
    gridTotal = total;
  }
  buildGrid(L.WINDOWS);
  var firstPaint = true;

  function crowdBuckets(key) {
    if (Server.on) return state.crowdDay === key && state.crowd ? state.crowd : null;
    return L.crowdForDay(key);
  }

  function othersCount(now) {
    var key = L.toDateKey(now);
    var b = crowdBuckets(key);
    if (!b) return null;
    if (Server.on) {
      var total = b.reduce(function (a, x) { return a + x; }, 0);
      var meIn = !!L.findDay(state.records, key) && !(Local.get(K.pending) || []).includes(key) && !(state.rejected || []).includes(key);
      return Math.max(0, total - (meIn ? 1 : 0));
    }
    return L.awakeUntil(b, nowMinuteFrac(now));
  }

  function updateScene() {
    if (currentRoom()) return updateRoomScene();
    var now = effectiveNow(), key = L.toDateKey(now);
    var rec = L.findDay(currentRecords(), key);
    var count = othersCount(now);
    scene.classList.toggle('dawn', !!rec);
    var di = rec ? L.dayInfo(journey(now), key) : null;
    applySky(scene, di && di.sky ? L.skyById(di.sky) : null);
    var line = scene.querySelector('#crowdLine'), per = scene.querySelector('#perLine'), dot = scene.querySelector('#liveDot');
    if (count === null) {
      line.textContent = state.serverOk === false ? '지금은 함께 보기를 불러올 수 없어요' : '불러오는 중';
      per.textContent = ''; dot.className = 'dot demo';
      return;
    }
    var lw = L.litWindows(count, key, ME);
    var grew = lw.total !== gridTotal;
    if (grew) buildGrid(lw.total);
    var want = {}; lw.lit.forEach(function (i) { want[i] = true; });
    var stagger = firstPaint && !reduced;
    var quiet = grew && !firstPaint; // 층이 늘어 다시 그릴 땐 깜빡임 없이
    winEls.forEach(function (el, i) {
      var isMe = i === ME;
      var on = isMe ? !!rec : !!want[i];
      el.classList.toggle('me', isMe);
      if (on && !el.classList.contains('on')) {
        el.classList.add('on');
        if (!reduced && !isMe && !quiet) {
          el.classList.add('pop');
          el.style.animationDelay = stagger ? (Math.random() * 1.2).toFixed(2) + 's' : '0s';
          setTimeout(function () { el.classList.remove('pop'); el.style.animationDelay = ''; }, 2400);
        }
      } else if (!on && el.classList.contains('on')) { el.classList.remove('on', 'pop'); }
    });
    firstPaint = false;
    var people = count + (rec ? 1 : 0);
    line.innerHTML = people ? '<b class="num">' + people.toLocaleString('ko-KR') + '명</b>이 하루를 시작했어요' : '아직 아무도 없어요. 첫 창문을 켜 보세요';
    per.textContent = lw.overflow ? '외 ' + lw.overflow.toLocaleString('ko-KR') + '명' : '';
    var recent = Server.on ? '모든 사용자 기준 · 30초마다 새로 고침' : '';
    if (!Server.on && L.dayPhase(L.minuteOfDay(now)) === 'open') {
      var rc = L.recentCount(L.crowdForDay(key), nowMinuteFrac(now), 10);
      if (rc > 0) recent = '최근 10분 동안 ' + rc.toLocaleString('ko-KR') + '명이 불을 켰어요';
    }
    scene.querySelector('#recentLine').textContent = recent;
    dot.className = Server.on ? 'dot' : 'dot demo';
    scene.querySelector('#buildingImg').setAttribute('aria-label', '불 켜진 창문 ' + (lw.lit.length + (rec ? 1 : 0)) + '개' + (rec ? ', 내 창문 포함' : ''));
  }
  function blinkOne() {
    if (reduced) return;
    var lit = winEls.filter(function (el) { return el.classList.contains('on') && !el.classList.contains('me'); });
    if (!lit.length) return;
    var el = lit[Math.floor(Math.random() * lit.length)];
    el.classList.add('blink'); setTimeout(function () { el.classList.remove('blink'); }, 1500);
  }
  function refreshCrowd() {
    if (!Server.on) return Promise.resolve();
    var key = L.toDateKey(effectiveNow());
    return Server.counts(key).then(function (b) {
      state.crowd = b; state.crowdDay = key; state.serverOk = true;
    }).catch(function () { state.serverOk = false; }).then(function () { if (state.tab === 'today') updateScene(); });
  }

  // ---------- 그리기 ----------
  var view = document.getElementById('view');
  function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dur(min) { var a = Math.abs(min), h = Math.floor(a / 60), m = a % 60; return (h ? h + '시간 ' : '') + (m || !h ? m + '분' : '').trim(); }
  var SUN = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v2M4.9 6.9l1.4 1.4M19.1 6.9l-1.4 1.4M2 15h2M20 15h2M7 15a5 5 0 0 1 10 0M3 19h18"/></svg>';
  var CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CROWN = '<svg class="crown" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';
  var MOON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';

  // ---------- 여정 (하늘·연속·보호권·칭호) ----------
  // 다음 연출 안내 문장: "연속 7일이 되면 햇살이 펼쳐져요"
  function effectPhrase(nx) {
    if (!nx || nx.at <= 1) return '';
    var v = { '아침 새': '가 날아와요', '햇살': '이 펼쳐져요', '별똥별': '이 떨어져요', '금빛 고리': '가 생겨요' }[nx.label] || '';
    return '연속 ' + nx.at + '일이 되면 ' + nx.label + v;
  }
  function journey(now) { return L.journeyTimeline(currentRecords(), L.toDateKey(now || effectiveNow()), state.settings); }
  function hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function mixHex(a, b, t) { var x = hex2rgb(a), y = hex2rgb(b); return 'rgb(' + x.map(function (v, i) { return Math.round(v + (y[i] - v) * t); }).join(',') + ')'; }
  function skyGrad(k, deg) { return 'linear-gradient(' + (deg || 180) + 'deg, ' + k.top + ' 0%, ' + k.mid + ' 55%, ' + k.bot + ' 100%)'; }
  function skySwatch(k, big) { return '<span class="sky-swatch' + (big ? ' big' : '') + '" style="background:' + skyGrad(k) + '" aria-hidden="true"></span>'; }
  function tierTag(k) { return '<span class="tier t' + k.tier + '">' + L.TIER_NAMES[k.tier] + '</span>'; }
  function shieldsHtml(n) { var h = '<span class="shield" aria-label="보호권 ' + n + '개">'; for (var i = 0; i < L.MAX_SHIELDS; i++) h += '<i class="' + (i < n ? 'on' : '') + '"></i>'; return h + '</span>'; }
  // 기록한 날의 장면: 위쪽은 오늘 하늘, 아래쪽은 어두운 밤으로 이어지게 (글자 대비 유지)
  function applySky(el, k) {
    if (!el) return;
    var skyEl = el.querySelector('.sky'), orb = el.querySelector('.orb'), fx = skyEl && skyEl.querySelector('.fx');
    el.className = el.className.replace(/\bsky-[a-z]+\b/g, '').trim();
    if (!k) { el.style.background = ''; if (orb) orb.style.background = ''; if (fx) fx.remove(); return; }
    el.style.background = 'linear-gradient(180deg, ' + k.top + ' 0%, ' + mixHex(k.mid, '#121A2E', .35) + ' 26%, ' + mixHex(k.bot, '#1B2138', .82) + ' 52%, #181F34 78%)';
    el.classList.add('sky-' + k.id);
    if (orb) { orb.style.background = k.sun; orb.style.boxShadow = '0 0 28px ' + k.sun; }
    if (skyEl) {
      if (!fx) { fx = document.createElement('span'); skyEl.appendChild(fx); }
      fx.className = 'fx' + (k.fx ? ' fx-' + k.fx : '');
    }
  }

  function render() {
    var now = effectiveNow();
    document.getElementById('date').textContent = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    document.getElementById('trialBar').hidden = !state.trial;
    if (state.trial) document.getElementById('trialText').textContent = '체험 중 · 지금이 ' + L.formatMinute(state.trial.minute) + '라고 가정 (저장 안 함)';
    document.querySelectorAll('nav.tabs button').forEach(function (b) {
      if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    document.getElementById('demoNote').textContent = Server.on ? '' : '미리보기 · 다른 사람 창문은 예시예요 (하루 60명 가정)';
    if (!state.settings) { view.innerHTML = ''; return; }
    if (state.tab === 'habit') renderHabit(now); else renderToday(now);
  }

  function renderToday(now) {
    var s = state.settings, key = L.toDateKey(now), min = L.minuteOfDay(now);
    var rec = L.findDay(currentRecords(), key);
    var plan = L.planInfo(s, key);
    var room = currentRoom();
    state.leaveArmed = false;
    var html = (Server.on ? switchHtml() : '') + (room ? roomSceneHtml(room) : '<div id="sceneSlot"></div>'), trialLink = '', shareHtml = '';
    if (rec) {
      var ev = L.evaluate(rec);
      var title, sub, badge;
      if (ev.status === 'hit') {
        badge = '<span class="badge hit">' + CHECK + '목표 달성</span>';
        title = L.formatMinute(rec.minuteOfDay) + '에 하루를 시작했어요';
        sub = ev.diff < -5 ? '목표보다 ' + dur(ev.diff) + ' 일찍이에요. 매일 같은 시각을 지키는 게 제일 중요해요.' : '목표 시각을 지켰어요. 이 리듬이면 충분해요.';
      } else if (ev.status === 'early') {
        badge = '<span class="badge early">많이 일찍</span>';
        title = L.formatMinute(rec.minuteOfDay) + '에 하루를 시작했어요';
        sub = '목표보다 ' + dur(ev.diff) + ' 일찍이에요. 기록은 됐지만, 일찍보다 매일 비슷한 시각이 몸에 더 좋아요. 오늘 낮에 너무 피곤하지 않게 챙겨요.';
      } else if (ev.status === 'close') {
        badge = '<span class="badge close">조금 늦었어요</span>';
        title = L.formatMinute(rec.minuteOfDay) + '에 하루를 시작했어요';
        sub = '목표보다 ' + dur(ev.diff) + ' 늦었지만, 기록하는 것 자체가 습관을 만들어요.';
      } else if (ev.status === 'late') {
        badge = '<span class="badge late">괜찮아요</span>';
        title = '늦어도 시작한 게 중요해요';
        sub = '목표보다 ' + dur(ev.diff) + ' 늦었어요. 하루 놓쳐도 습관이 무너지지 않아요. 내일 다시 같은 목표로 가요.';
      } else {
        badge = '<span class="badge none">기록됨</span>';
        title = L.formatMinute(rec.minuteOfDay) + '에 하루를 시작했어요';
        sub = '';
      }
      var tl = journey(now), di = L.dayInfo(tl, key), sk = L.skyById(di && di.sky);
      var nx = L.nextEffect(tl.streak);
      html += '<section class="card' + (state.justStarted === key ? ' fade' : '') + '" aria-label="오늘 결과">' + badge +
        '<h2 class="status-title">' + title + '</h2>' + (sub ? '<p class="status-sub">' + sub + '</p>' : '') +
        '<div class="sky-row">' + skySwatch(sk) + '<div style="flex:1"><div>오늘의 하늘 · <b>' + esc(sk.name) + '</b>' + tierTag(sk) + '</div>' +
        '<div class="sub">연속 <b class="num">' + tl.streak + '일</b> · 보호권 ' + shieldsHtml(tl.shields) + (nx && effectPhrase(nx) ? ' · ' + nx.left + '일 뒤 ' + nx.label : '') + '</div></div>' +
        '<button type="button" class="link-btn quiet" data-replay>다시 보기</button></div>' +
        (weatherLine(rec) ? '<p class="status-sub" style="margin-top:8px">' + weatherLine(rec) + '</p>' : '') +
        (state.trial ? '' : '<div class="moods" role="group" aria-label="오늘 컨디션"><span class="label">컨디션</span>' + L.MOODS.map(function (m) { return '<button type="button" data-mood="' + m.v + '" aria-pressed="' + (rec.mood === m.v) + '">' + m.label + '</button>'; }).join('') + '</div>') +
        (canUndo(rec) ? '<div style="margin-top:6px"><button type="button" class="link-btn quiet" data-undo>잘못 눌렀어요 · 취소</button></div>' : '') + '</section>';
      html += adviceHtml(rec, key);
      html += '<section class="card action"><div><div class="label">일어나서 바로 할 한 가지</div><div class="action-text">' + esc(s.firstAction) + '</div></div>' +

          (diff > L.EARLY_TOL ? '목표까지 ' + dur(diff) + ' 남았어요. 목표 30분 전부터 누르면 목표 달성이에요' : (diff > 0 ? '지금 시작하면 목표 달성이에요 (목표 ' + dur(diff) + ' 전)' : (diff >= -L.HIT_TOL ? '지금 시작하면 목표 달성이에요' : '목표 시각이 지났어요. 지금 시작해도 기록돼요'))) + '</div></section>';

        if (!state.trial) trialLink = '<div class="center"><button type="button" class="link-btn" data-open-trial>아침 시간으로 체험해보기</button></div>';
      } else {

    var recap = state.trial ? null : L.weekRecap(currentRecords(), key, null, s);

  function chartSVG(st) {
    var W = 340, H = 170, padL = 44, padR = 8, padT = 12, padB = 26;
    var vals = [];
    st.last14.forEach(function (d) { if (d.min !== null) vals.push(d.min); if (d.target !== null) vals.push(d.target); });
    var lo = Math.floor((Math.min.apply(null, vals) - 20) / 30) * 30, hi = Math.ceil((Math.max.apply(null, vals) + 20) / 30) * 30;
    if (hi - lo < 90) { hi = lo + 90; }
    var x = function (i) { return padL + i * ((W - padL - padR) / 13); };
    var y = function (m) { return padT + (m - lo) / (hi - lo) * (H - padT - padB); };
    var g = '';
    st.last14.forEach(function (d, i) { if (d.weekend) g += '<rect x="' + (x(i) - 10) + '" y="' + padT + '" width="20" height="' + (H - padT - padB) + '" rx="4" fill="#1C2338"/>'; });
    var step = (hi - lo) / 30 > 6 ? 60 : 30;
    for (var t = lo; t <= hi; t += step) {
      g += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#2B3450" stroke-width="1"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="#A6ADBF" font-family="Space Grotesk, sans-serif">' + L.formatMinute(t) + '</text>';
    }
    var path = '';
    st.last14.forEach(function (d, i) { if (d.target !== null) path += (path ? 'L' : 'M') + (x(i) - 8) + ' ' + y(d.target) + 'L' + (x(i) + 8) + ' ' + y(d.target); });
    if (path) g += '<path d="' + path + '" fill="none" stroke="#FFC75A" stroke-width="1.5" stroke-dasharray="4 3"/>';
    st.last14.forEach(function (d, i) {
      if (d.min === null) return;
      var stt = d.target === null ? 'none' : (d.min - d.target < -L.EARLY_TOL ? 'early' : (d.min - d.target <= L.HIT_TOL ? 'hit' : (d.min - d.target <= 60 ? 'close' : 'late')));
      var c = { hit: '#5BD6A0', early: '#86BEE6', close: '#FFC75A', late: '#FF9B8A', none: '#A6ADBF' }[stt];
      g += '<circle cx="' + x(i) + '" cy="' + y(d.min) + '" r="5" fill="' + c + '" stroke="#171D30" stroke-width="2"/>';
    });
    [0, 7, 13].forEach(function (i) {
      var d = st.last14[i];
      g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="#A6ADBF">' + (i === 13 ? '오늘' : Number(d.key.slice(8)) + '일') + '</text>';
    });
    var n = st.last14.filter(function (d) { return d.min !== null; }).length;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="최근 14일 하루 시작 시각. 기록 ' + n + '일, 점선은 그날의 목표">' + g + '</svg>';
  }

    // 달력: 그날 하늘 색, 시각, 쉰 날 방패
    var cm = state.calMonth || key.slice(0, 7), cy = +cm.slice(0, 4), cmo = +cm.slice(5, 7), dayMap = {};

    // 하늘 도감

  // ---------- 실제 날씨 (켠 사람만, Open-Meteo) ----------
  // 위치는 고른 도시 또는 대략 위치(소수 첫째 자리, 약 10km)만 이 기기에 저장. 하루 시작을 누를 때 최근 날씨를 기록에 붙임.
  function weatherCfg() { var w = Local.get(K.weather); return w && w.on && typeof w.lat === 'number' && typeof w.lon === 'number' ? w : null; }
  var wxFetching = null;
  function fetchWeather(force) {
    var w = weatherCfg(); if (!w || !/^https?:$/.test(location.protocol)) return Promise.resolve(null);
    var c = Local.get(K.wxCache), now = Date.now();
    if (!force && c && c.lat === w.lat && c.lon === w.lon && now - c.at < 30 * 60000) return Promise.resolve(c);

    var days = tl0.restDays.concat(tl0.offDays).filter(function (d) { return daysSince(d, today) <= 66; }).sort();
    if (!days.length) return Promise.resolve();

  function myAccountData() {
    var d = L.accountData(state.settings, state.records, state.rooms, state.nick), c = Local.get(K.consent);
    if (c && typeof c.at === 'string') d.consent = { v: Number(c.v) || 1, at: c.at.slice(0, 30) };
    return d;
  }
  var saveTimer = null;
  function saveAccountSoon() {
    if (!Server.on || !state.account) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      Server.rpc('save_account', { p_anon: anonId, p_data: myAccountData() }).then(function (ok) {
        if (ok === false) { state.account = null; Local.del(K.account); }   // 다른 곳에서 계정이 삭제됨
      }).catch(function () {});
    }, 1500);
  }
  function accountSectionHtml() {
    if (state.account) {
      return '<div class="section-label">계정</div><div class="note account"><b>@' + esc(state.account.username) + '</b>로 로그인돼 있어요. 기록·목표·방 목록이 계정에 자동으로 보관돼요.' +
        '<div class="row"><button type="button" class="secondary" id="accLogout">로그아웃</button><button type="button" class="secondary" id="accClose">계정 삭제</button></div>' +
        (has('recovery') ? '<div class="center"><button type="button" class="link-btn quiet" id="accRecovery">복구 코드 새로 만들기</button></div>' : '') + '</div>';
    }
    return '<div class="section-label">계정 (선택)</div><div class="note account">가입하면 폰을 바꾸거나 다른 기기에서도 기록·목표·방이 그대로 이어져요. 가입하지 않아도 지금처럼 쓸 수 있어요.' +
      '<div class="row"><button type="button" class="primary" id="accSignup">가입하기</button><button type="button" class="secondary" id="accLogin">로그인</button></div></div>';
  }
  function bindAccountSection(el) {
    var b;
    if ((b = el.querySelector('#accSignup'))) b.addEventListener('click', openSignup);
    if ((b = el.querySelector('#accLogin'))) b.addEventListener('click', openLogin);
    if ((b = el.querySelector('#accLogout'))) b.addEventListener('click', function (e) {
      var btn = e.currentTarget;
      if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = '한 번 더 누르면 로그아웃'; toast('로그아웃하면 이 기기에서는 기록이 지워지고, 계정에는 남아요.'); return; }
      btn.disabled = true;
      Server.rpc('save_account', { p_anon: anonId, p_data: myAccountData() }).then(function () {
        [K.settings, K.records, K.v1, K.rooms, K.view, K.nick, K.pending, K.pendingRoom, K.account, K.anon].forEach(function (k) { Local.del(k); });
        location.reload();
      }).catch(function () { btn.disabled = false; toast('연결이 불안정해서 로그아웃하지 않았어요. 기록이 보관된 뒤에 다시 시도해 주세요.'); });
    });
    if ((b = el.querySelector('#accClose'))) b.addEventListener('click', openCloseAccount);
    if ((b = el.querySelector('#accRecovery'))) b.addEventListener('click', openNewRecovery);
  }
  function credFields(newPw) {
    return '<div class="field"><label for="accUser">아이디 (영문 소문자·숫자·_ . 4~20자)</label><input id="accUser" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false"></div>' +
      '<div class="field"><label for="accPw">비밀번호 (8자 이상)</label><input id="accPw" type="password" maxlength="64" autocomplete="' + (newPw ? 'new-password' : 'current-password') + '"></div>' +
      (newPw ? '<div class="field"><label for="accPw2">비밀번호 확인</label><input id="accPw2" type="password" maxlength="64" autocomplete="new-password"></div>' : '');
  }
  function sheetOpen(html) {
    var el = document.getElementById('sheetBody');
    el.innerHTML = html + '<div class="err" id="accErr" role="alert"></div>';
    document.getElementById('sheet').hidden = false;
    return el;
  }
  function openSignup() {
    var el = sheetOpen('<h2 id="sheetTitle">가입하기</h2><p class="lead">이 기기의 기록과 방이 계정에 그대로 옮겨져요. <b>비밀번호를 잊으면 찾을 수 없어요.</b> 다른 곳에서 쓰지 않는 비밀번호를 써 주세요.</p>' +
      credFields(true) + '<label class="check"><input type="checkbox" id="accAgree"> <span>만 14세 이상이고, ' + legalLinks() + '에 동의해요</span></label>' +
      '<button type="button" class="primary" id="accGo" style="width:100%;margin-top:6px">가입하기</button><button type="button" class="close-btn" id="accBack">닫기</button>');
    el.querySelector('#accBack').addEventListener('click', closeSheet);
    el.querySelector('#accUser').focus();
    el.querySelector('#accGo').addEventListener('click', function (e) {
      var btn = e.currentTarget, err = el.querySelector('#accErr');
      var u = L.normUsername(el.querySelector('#accUser').value), pw = el.querySelector('#accPw').value, pw2 = el.querySelector('#accPw2').value;
      if (!L.validUsername(u)) { err.textContent = ACC_ERR.bad_username; return; }
      if (!L.validPassword(pw)) { err.textContent = ACC_ERR.bad_password; return; }
      if (pw !== pw2) { err.textContent = '비밀번호 확인이 달라요.'; return; }
      if (!el.querySelector('#accAgree').checked) { err.textContent = '만 14세 이상만 가입할 수 있어요. 약관과 처리방침에 동의해 주세요.'; return; }
      Local.set(K.consent, { v: 1, at: new Date().toISOString() });
      btn.disabled = true; err.textContent = '';
      Server.rpc('sign_up', { p_anon: anonId, p_username: u, p_password: pw, p_data: myAccountData() }).then(function (res) {
        if (!res || res.error) { btn.disabled = false; err.textContent = accErr(res && res.error); return; }
        state.account = { username: res.username }; Local.set(K.account, state.account);
        if (!has('recovery')) { closeSheet(); toast('가입했어요. 이제 기록이 계정에 보관돼요.'); return; }
        return Server.rpc('set_recovery_code', { p_anon: anonId, p_password: pw }).then(function (r2) {
          if (!r2 || !r2.recovery_code) throw new Error('no_code');
          showRecoveryCode(r2.recovery_code, '가입했어요 · 복구 코드', function () { closeSheet(); toast('가입했어요. 이제 기록이 계정에 보관돼요.'); });
        }).catch(function () { closeSheet(); toast('가입했어요. 복구 코드는 설정 → 계정에서 만들 수 있어요.'); });
      }).catch(function (x) { btn.disabled = false; err.textContent = accErr(x && x.message); });
    });
  }
  function openLogin() {
    var el = sheetOpen('<h2 id="sheetTitle">로그인</h2><p class="lead">계정에 보관된 기록·목표·방을 이 기기로 가져와요. 이 기기에 있던 기록도 계정에 합쳐져요.</p>' +
      credFields(false) + '<button type="button" class="primary" id="accGo" style="width:100%;margin-top:6px">로그인</button>' +
      (has('recovery') ? '<div class="center"><button type="button" class="link-btn quiet" id="accForgot">비밀번호를 잊었어요</button></div>' : '') +
      '<button type="button" class="close-btn" id="accBack">닫기</button>');
    el.querySelector('#accBack').addEventListener('click', closeSheet);
    if (el.querySelector('#accForgot')) el.querySelector('#accForgot').addEventListener('click', openReset);
    el.querySelector('#accUser').focus();
    el.querySelector('#accGo').addEventListener('click', function (e) {
      var btn = e.currentTarget, err = el.querySelector('#accErr');
      var u = L.normUsername(el.querySelector('#accUser').value), pw = el.querySelector('#accPw').value;
      if (!u || !pw) { err.textContent = '아이디와 비밀번호를 적어 주세요.'; return; }
      btn.disabled = true; err.textContent = '';
      Server.rpc('sign_in', { p_username: u, p_password: pw }).then(function (res) {
        if (!res || res.error || !/^[0-9a-f-]{36}$/.test(String(res.anon_id))) { btn.disabled = false; err.textContent = accErr(res && res.error); return; }
        return adoptAccount(res).then(function () { location.reload(); });
      }).catch(function (x) { btn.disabled = false; err.textContent = accErr(x && x.message); });
    });
  }
  // 로그인·복구 성공: 계정의 기기 번호와 기록을 이 기기로
  function adoptAccount(res) {
    var merged = L.mergeAccount(myAccountData(), res.data || {});
    // 방은 기기 번호에 묶여 있어서 계정 쪽 방만 가져옴 (이 기기에서 따로 들어간 방은 계정 번호로는 들어가 있지 않음)
    merged.rooms = L.cleanRooms((res.data || {}).rooms);
    if (res.data && res.data.consent) merged.consent = res.data.consent;
    Local.set(K.anon, res.anon_id);
    Local.set(K.records, merged.records);
    if (merged.settings) Local.set(K.settings, merged.settings);
    Local.set(K.rooms, merged.rooms);
    if (merged.nick) Local.set(K.nick, merged.nick);
    if (merged.consent) Local.set(K.consent, merged.consent);
    Local.set(K.account, { username: res.username });
    Local.del(K.pending); Local.del(K.pendingRoom); Local.del(K.view);
    return Server.rpc('save_account', { p_anon: res.anon_id, p_data: merged }).catch(function () {});
  }
  // 복구 코드 보여주기 (한 번만)
  function showRecoveryCode(code, title, after) {
    var el = sheetOpen('<h2 id="sheetTitle">' + esc(title || '복구 코드') + '</h2><p class="lead">비밀번호를 잊었을 때 이 코드로 새 비밀번호를 정할 수 있어요. <b>지금 한 번만 보여줘요.</b> 캡처하거나 메모해 두세요.</p>' +
      '<div class="note" style="text-align:center"><span class="code" id="recCode" style="font-size:26px;letter-spacing:3px">' + esc(code) + '</span></div>' +
      '<div class="btn-col"><button type="button" class="secondary" id="recCopy">코드 복사</button><button type="button" class="primary" id="recDone">저장했어요</button></div>');
    el.querySelector('#recCopy').addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function () { toast('복구 코드를 복사했어요. 메모 앱에 붙여 넣어 두세요.'); }, function () {});
    });
    el.querySelector('#recDone').addEventListener('click', function () { if (after) after(); else closeSheet(); });
    el.querySelector('h2').setAttribute('tabindex', '-1'); el.querySelector('h2').focus();
  }
  function openNewRecovery() {
    var el = sheetOpen('<h2 id="sheetTitle">복구 코드 새로 만들기</h2><p class="lead">새 코드를 만들면 예전 코드는 더 이상 쓸 수 없어요.</p>' +
      '<div class="field"><label for="accPw">비밀번호 확인</label><input id="accPw" type="password" maxlength="64" autocomplete="current-password"></div>' +
      '<button type="button" class="primary" id="accGo" style="width:100%">새 코드 만들기</button><button type="button" class="close-btn" id="accBack">닫기</button>');
    el.querySelector('#accBack').addEventListener('click', closeSheet);
    el.querySelector('#accPw').focus();
    el.querySelector('#accGo').addEventListener('click', function (e) {
      var btn = e.currentTarget, err = el.querySelector('#accErr');
      btn.disabled = true; err.textContent = '';
      Server.rpc('set_recovery_code', { p_anon: anonId, p_password: el.querySelector('#accPw').value }).then(function (res) {
        if (!res || res.error || !res.recovery_code) { btn.disabled = false; err.textContent = accErr(res && res.error); return; }
        showRecoveryCode(res.recovery_code, '새 복구 코드');
      }).catch(function (x) { btn.disabled = false; err.textContent = accErr(x && x.message); });
    });
  }
  function openReset() {
    var el = sheetOpen('<h2 id="sheetTitle">비밀번호 다시 정하기</h2><p class="lead">가입할 때 받은 12자리 복구 코드가 있으면 새 비밀번호를 정할 수 있어요. 복구 코드가 없으면 되찾을 수 없어요.</p>' +
      '<div class="field"><label for="accUser">아이디</label><input id="accUser" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false"></div>' +
      '<div class="field"><label for="recIn">복구 코드 (12자리)</label><input id="recIn" maxlength="20" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="ABCD-EFGH-JKMN"></div>' +
      '<div class="field"><label for="accPw">새 비밀번호 (8자 이상)</label><input id="accPw" type="password" maxlength="64" autocomplete="new-password"></div>' +
      '<div class="field"><label for="accPw2">새 비밀번호 확인</label><input id="accPw2" type="password" maxlength="64" autocomplete="new-password"></div>' +
      '<button type="button" class="primary" id="accGo" style="width:100%;margin-top:6px">새 비밀번호로 로그인</button><button type="button" class="close-btn" id="accBack">닫기</button>');
    el.querySelector('#accBack').addEventListener('click', closeSheet);
    el.querySelector('#accUser').focus();
    el.querySelector('#accGo').addEventListener('click', function (e) {
      var btn = e.currentTarget, err = el.querySelector('#accErr');
      var u = L.normUsername(el.querySelector('#accUser').value), code = el.querySelector('#recIn').value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
      var pw = el.querySelector('#accPw').value, pw2 = el.querySelector('#accPw2').value;
      if (!L.validUsername(u)) { err.textContent = ACC_ERR.bad_username; return; }
      if (code.length !== 12) { err.textContent = '복구 코드는 12자리예요.'; return; }
      if (!L.validPassword(pw)) { err.textContent = ACC_ERR.bad_password; return; }
      if (pw !== pw2) { err.textContent = '비밀번호 확인이 달라요.'; return; }
      btn.disabled = true; err.textContent = '';
      Server.rpc('reset_password', { p_username: u, p_code: code, p_new_password: pw }).then(function (res) {
        if (!res || res.error || !/^[0-9a-f-]{36}$/.test(String(res.anon_id))) { btn.disabled = false; err.textContent = accErr(res && res.error); return; }
        return adoptAccount(res).then(function () {
          showRecoveryCode(String(res.recovery_code || ''), '새 비밀번호로 바꿨어요', function () { location.reload(); });
        });
      }).catch(function (x) { btn.disabled = false; err.textContent = accErr(x && x.message); });
    });
  }
  function openCloseAccount() {
    var el = sheetOpen('<h2 id="sheetTitle">계정 삭제</h2><p class="lead">계정과 계정에 보관한 기록이 지워지고, 아이디는 다른 사람이 쓸 수 있게 돼요. 이 기기의 기록과 방은 그대로 남아요.</p>' +
      '<div class="field"><label for="accPw">비밀번호 확인</label><input id="accPw" type="password" maxlength="64" autocomplete="current-password"></div>' +
      '<button type="button" class="danger" id="accGo">계정 삭제</button><button type="button" class="close-btn" id="accBack">닫기</button>');
    el.querySelector('#accBack').addEventListener('click', closeSheet);
    el.querySelector('#accPw').focus();
    el.querySelector('#accGo').addEventListener('click', function (e) {
      var btn = e.currentTarget, err = el.querySelector('#accErr');
      btn.disabled = true; err.textContent = '';
      Server.rpc('close_account', { p_anon: anonId, p_password: el.querySelector('#accPw').value }).then(function (res) {
        if (!res || res.error) { btn.disabled = false; err.textContent = accErr(res && res.error); return; }
        state.account = null; Local.del(K.account);
        closeSheet(); toast('계정을 삭제했어요. 이 기기의 기록은 그대로예요.');
      }).catch(function (x) { btn.disabled = false; err.textContent = accErr(x && x.message); });
    });
  }

  // ---------- 시작 ----------
  var storedSettings = Local.get(K.settings);
  if (storedSettings && !L.validateSettings(storedSettings).length) {
    var mig = L.migrateSettings(storedSettings, L.toDateKey(realNow()));
    if (mig !== storedSettings) Local.set(K.settings, mig);
    storedSettings = mig;
  }
  state.settings = storedSettings && !L.validateSettings(storedSettings).length ? storedSettings : null;
  state.records = L.mergeRecords(Local.get(K.records), Local.get(K.v1));
  state.rooms = (Local.get(K.rooms) || []).filter(function (r) { return r && L.parseRoomCode(String(r.code)) === r.code && typeof r.name === 'string'; })
    .map(function (r) { return { code: r.code, name: L.sanitizeName(r.name, 20) || '우리 방' }; });
  var savedView = Local.get(K.view);
  state.view = state.rooms.some(function (r) { return r.code === savedView; }) ? savedView : 'all';
  state.nick = L.sanitizeName(String(Local.get(K.nick) || ''), 10);
  var acc = Local.get(K.account);
  state.account = acc && L.validUsername(acc.username) ? { username: L.normUsername(acc.username) } : null;

  if (!state.settings) {
    funnel('visit');
    state.ob = { step: 0, baselineMin: 480, targetMin: 420, action: ACTIONS[0], custom: false, age: null };
    document.getElementById('ob').hidden = false;
    renderOnboarding();
  }
  (function shortcuts() {
    var q = location.search;
    if (/[?&]tab=habit\b/.test(q) && state.settings) state.tab = 'habit';
    if (/[?&](start=1|from=push)\b/.test(q)) state.wantStart = true;
    if (/[?&](tab|start|from)=/.test(q) && !/[?&]room=/.test(q)) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  })();
  render();
  if (state.wantStart) {
    var sb = document.getElementById('startBtn');
    if (sb) { sb.scrollIntoView({ block: 'center' }); sb.classList.add('nudge'); setTimeout(function () { sb.classList.remove('nudge'); }, 3000); }
  }
  checkInvite();

  var lastKey = L.toDateKey(effectiveNow());
  setInterval(function () {
    if (!state.settings || !document.getElementById('sheet').hidden) return;
    var key = L.toDateKey(effectiveNow());
    if (key !== lastKey) { lastKey = key; render(); return; }
    if (state.tab === 'today') {
      var phaseNow = L.dayPhase(L.minuteOfDay(effectiveNow()));
      if (phaseNow !== state.lastPhase) { state.lastPhase = phaseNow; render(); } else updateScene();
      if (!currentRoom() && Math.random() < 0.35) blinkOne();
    }
  }, 4000);
  if (Server.on) {
    refreshCrowd(); syncPending(); syncRoomStarts(); syncProfile(); fetchWeather();
    Server.rpc('app_info', {}).then(function (i) {
      if (i && Array.isArray(i.features)) state.features = i.features.filter(function (f) { return typeof f === 'string'; });
      if (i && typeof i.vapid === 'string' && /^[A-Za-z0-9_-]{80,100}$/.test(i.vapid)) state.vapid = i.vapid;
      flushErrors(); syncRests(); updatePushPrefs(); flushFunnel();
    }).catch(function () {});
    setInterval(function () { if (document.visibilityState !== 'hidden') refreshCrowd(); }, 30000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      refreshCrowd(); syncPending(); syncRoomStarts(); fetchWeather();
      if (state.tab === 'today' && currentRoom()) refreshRoom();
    });
    setInterval(function () { if (state.tab === 'today' && currentRoom() && document.visibilityState !== 'hidden') refreshRoom(); }, 20000);
  }

  Cloud.connect().then(function (ok) {
    if (!ok) return;
    return Cloud.load().then(function (c) {
      var before = JSON.stringify([state.records, state.settings]);
      state.records = L.mergeRecords(state.records, c.records);
      if (!state.settings && c.settings && !L.validateSettings(c.settings).length) {
        state.settings = c.settings; state.ob = null; document.getElementById('ob').hidden = true;
      }
      Local.set(K.records, state.records);
      if (state.settings) Local.set(K.settings, state.settings);
      if (JSON.stringify([state.records, state.settings]) !== before) render();
    }).catch(function () {});
  });

  /*__WEB_INIT__*/
  window.__wakeApp = { state: state, render: render, anonId: anonId };
})();
</script>
</body>
</html>
